<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中野一花 - 项目导航页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }

        body {
            background-color: #08080b;
            background-image: radial-gradient(circle at center, #1a1510 0%, #08080b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-card {
            width: 100%;
            max-width: 420px;
            background: #121217;
            border: 1px solid #d4af3740;
            border-radius: 20px;
            padding: 35px 28px;
            box-shadow: 0 0 30px #d4af3725;
            text-align: center;
        }

        /* 同级图片Logo容器 */
        .logo-box {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #d4af3760;
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-title {
            font-size: 28px;
            color: #d4af37;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .project-sub {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .btn-gold {
            background: linear-gradient(135deg, #b8860b, #d4af37);
            color: #000;
        }
        .btn-gold:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px #d4af3735;
        }

        .btn-dark {
            background: transparent;
            border: 1px solid #d4af3770;
            color: #d4af37;
        }
        .btn-dark:hover {
            background-color: #d4af3715;
            transform: translateY(-2px);
        }

        .card-key-wrap {
            background: #1a1a22;
            border-radius: 12px;
            padding: 16px;
            margin: 25px 0;
            border: 1px solid #d4af3730;
        }

        .key-text {
            color: #fff;
            font-size: 15px;
            word-break: break-all;
            margin-bottom: 12px;
        }

        .key-label {
            color: #d4af37;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .copyright {
            margin-top: 30px;
            color: #666;
            font-size: 12px;
        }

        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #d4af37;
            color: #000;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="toast" id="toast">复制成功！</div>

    <div class="main-card">
        <!-- ====== 和HTML同级的图片logo，修改文件名即可 ====== -->
        <div class="logo-box">
            <img src="山海.jpg" alt="中野一花 Logo">
        </div>

        <h1 class="project-title">中野一花</h1>
        <p class="project-sub">安卓工具 · 云端更新 · 卡密授权系统</p>

        <!-- 卡密区域 -->
        <div class="card-key-wrap">
            <div class="key-label">试用/授权卡密（一键复制）</div>
            <div class="key-text" id="authKey">暂时不存在卡密</div>
            <button class="btn btn-dark" onclick="copyKey()">一键复制卡密</button>
        </div>

        <!-- 【修改下方href里的链接】 -->
        <a href="https://你的APK直链地址.apk" class="btn btn-gold" target="_blank">下载最新安装包</a>
        <a href="https://t.me/ZYYHNB" class="btn btn-dark" target="_blank">跳转 Telegram 官方频道</a>
        <a href="https://qun.qq.com/universal-share/share?ac=1&authKey=7FR7X1z6MM6WLS6Ae%2BJsWZXbOUQwp191GMIQuqLRzNYr%2BNl8eDhuHDDHx3Bi%2FemS&busi_data=eyJncm91cENvZGUiOiIyODA3ODU1MDciLCJ0b2tlbiI6IjNUUmRhcjV6cExLTXJnNWd2dTUyZ0E1WlhzaWlxQWw3cjZLT1VEbkVOcDlYalRkZ0FyamFNWEcxSGVDL0o1bXMiLCJ1aW4iOiIyNzAyODAwOTUzIn0%3D&data=ltvaPlNOhrvZNs5bBcTI3LFHxbwoniZx3yOCEIJygv_ToFYGeyZqfbypO3mWolcp7FDvOsylHK-RbO4ZEg76-w&svctype=4&tempid=h5_group_info" class="btn btn-dark" target="_blank">跳转 QQ 交流群</a>

        <div class="copyright">
            © 2026 中野一花 所有权归属：山海&槿夕
        </div>
    </div>

    <script>
        function copyKey() {
            const keyDom = document.getElementById('authKey');
            const keyStr = keyDom.innerText;
            navigator.clipboard.writeText(keyStr).then(showToast).catch(()=>{
                const input = document.createElement('input');
                input.value = keyStr;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(()=>toast.classList.remove('show'),1500);
        }
    </script>
</body>
</html>
